<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<rect id="Background" x="0" y="0" width="390" height="844" fill="#FFFFFF"/>
<g id="Top Bar">
<rect id="Back Button" x="16" y="15" width="76" height="44" fill="#FFFFFF" stroke="#000000"/>
<text x="28" y="42" font-family="Space Mono" font-size="12" font-weight="400" fill="#000">&lt; BACK</text>
<text x="106" y="36" font-family="Geist" font-size="20" font-weight="700" fill="#000">Movie Name</text>
<text x="106" y="53" font-family="Space Mono" font-size="10" font-weight="400" fill="#5D5E66">MOVIE DETAILS</text>
<line x1="0" y1="73" x2="390" y2="73" stroke="#000000"/>
</g>
<g id="Poster Placeholder">
<rect x="16" y="89" width="130" height="195" fill="#E6E6E6" stroke="#000000"/>
<line x1="16" y1="89" x2="146" y2="284" stroke="#000000"/>
<line x1="146" y1="89" x2="16" y2="284" stroke="#000000"/>
</g>
<g id="Movie Info">
<text x="162" y="114" font-family="Geist" font-size="22" font-weight="700" fill="#000">Movie Name</text>
<text x="162" y="136" font-family="Space Mono" font-size="11" font-weight="400" fill="#5D5E66">RELEASED 2010</text>
<rect x="162" y="150" width="58" height="26" fill="#FFFFFF" stroke="#000000"/><text x="170" y="167" font-family="Space Mono" font-size="10" font-weight="400" fill="#000">SCI-FI</text>
<rect x="226" y="150" width="62" height="26" fill="#FFFFFF" stroke="#000000"/><text x="235" y="167" font-family="Space Mono" font-size="10" font-weight="400" fill="#000">ACTION</text>
<rect x="294" y="150" width="80" height="26" fill="#FFFFFF" stroke="#000000"/><text x="304" y="167" font-family="Space Mono" font-size="10" font-weight="400" fill="#000">THRILLER</text>
<rect x="162" y="190" width="212" height="56" fill="#FFFFFF" stroke="#000000"/>
<text x="176" y="228" font-family="Geist" font-size="28" font-weight="700" fill="#000">8.4</text>
<text x="222" y="228" font-family="Space Mono" font-size="11" font-weight="400" fill="#5D5E66">/10</text>
<text x="264" y="213" font-family="Space Mono" font-size="9" font-weight="400" fill="#5D5E66">AVG. RATING</text>
<text x="264" y="231" font-family="Space Mono" font-size="9" font-weight="400" fill="#000">124 REVIEWS</text>
</g>
<g id="Summary">
<text x="16" y="310" font-family="Space Mono" font-size="10" font-weight="400" fill="#5D5E66">SUMMARY</text>
<text x="16" y="334" font-family="Inter" font-size="14" font-weight="400" fill="#1A1A1A">Short plot summary of the movie is written here.</text>
<text x="16" y="356" font-family="Inter" font-size="14" font-weight="400" fill="#1A1A1A">It gives the user a quick idea about the story</text>
<text x="16" y="378" font-family="Inter" font-size="14" font-weight="400" fill="#1A1A1A">before reading the reviews and debates...</text>
</g>
<g id="Write Review Button">
<rect x="16" y="398" width="358" height="48" fill="#000000"/>
<text x="132" y="428" font-family="Geist" font-size="16" font-weight="500" fill="#FFFFFF">Write a Review →</text>
</g>
<line x1="16" y1="466" x2="374" y2="466" stroke="#D9D9D9"/>
<g id="Top Reviews Header">
<text x="16" y="492" font-family="Space Mono" font-size="10" font-weight="700" fill="#000">TOP REVIEWS</text>
<text x="270" y="492" font-family="Space Mono" font-size="10" font-weight="400" fill="#000">SEE ALL (124)</text>
<text x="352" y="492" font-family="Geist" font-size="12" font-weight="500" fill="#000">→</text>
<line x1="270" y1="496" x2="350" y2="496" stroke="#000000"/>
</g>

<g id="Review Card - username01">
<rect id="Avatar" x="16" y="510" width="34" height="34" fill="#E6E6E6" stroke="#9A9A9A"/>
<text x="58" y="525" font-family="Geist" font-size="15" font-weight="600" fill="#000">username01</text>
<text x="58" y="540" font-family="Space Mono" font-size="10" font-weight="400" fill="#5D5E66">DD/MM/YYYY</text>
<rect id="Rating Box" x="318" y="510" width="56" height="34" fill="#FFFFFF" stroke="#000000"/>
<text x="329" y="533" font-family="Geist" font-size="17" font-weight="700" fill="#000">8</text>
<text x="341" y="533" font-family="Space Mono" font-size="10" font-weight="400" fill="#5D5E66">/10</text>
<text x="16" y="568" font-family="Inter" font-size="14" font-weight="400" fill="#1A1A1A">The actual review is written here. Only a few lines</text><text x="16" y="590" font-family="Inter" font-size="14" font-weight="400" fill="#1A1A1A">are shown and to see the entire review the user</text><text x="16" y="612" font-family="Inter" font-size="14" font-weight="400" fill="#1A1A1A">presses the more button...</text>
<text x="16" y="634" font-family="Space Mono" font-size="10" font-weight="400" fill="#000">READ MORE</text>
<line x1="16" y1="637" x2="72" y2="637" stroke="#000000"/>
<rect id="Like Button" x="16" y="648" width="84" height="38" fill="#000000" stroke="#000000"/>
<text x="33" y="672" font-family="Geist" font-size="13" font-weight="500" fill="#FFFFFF">Like 12</text>
<rect id="Dislike Button" x="108" y="648" width="94" height="38" fill="#FFFFFF" stroke="#000000"/>
<text x="125" y="672" font-family="Geist" font-size="13" font-weight="500" fill="#000">Dislike 3</text>
<rect id="Counter Reviews Button" x="210" y="648" width="164" height="38" fill="#FFFFFF" stroke="#000000"/>
<text x="229" y="672" font-family="Geist" font-size="13" font-weight="500" fill="#000">5 Counter Reviews</text>
</g>
<line x1="16" y1="706" x2="374" y2="706" stroke="#D9D9D9"/>

<g id="Review Card - username02">
<rect id="Avatar" x="16" y="722" width="34" height="34" fill="#E6E6E6" stroke="#9A9A9A"/>
<text x="58" y="737" font-family="Geist" font-size="15" font-weight="600" fill="#000">username02</text>
<text x="58" y="752" font-family="Space Mono" font-size="10" font-weight="400" fill="#5D5E66">DD/MM/YYYY</text>
<rect id="Rating Box" x="318" y="722" width="56" height="34" fill="#FFFFFF" stroke="#000000"/>
<text x="329" y="745" font-family="Geist" font-size="17" font-weight="700" fill="#000">4</text>
<text x="341" y="745" font-family="Space Mono" font-size="10" font-weight="400" fill="#5D5E66">/10</text>
<text x="16" y="780" font-family="Inter" font-size="14" font-weight="400" fill="#1A1A1A">The actual review is written here. Only a few lines</text><text x="16" y="802" font-family="Inter" font-size="14" font-weight="400" fill="#1A1A1A">are shown and to see the entire review the user</text><text x="16" y="824" font-family="Inter" font-size="14" font-weight="400" fill="#1A1A1A">presses the more button...</text>
<text x="16" y="846" font-family="Space Mono" font-size="10" font-weight="400" fill="#000">READ MORE</text>
<line x1="16" y1="849" x2="72" y2="849" stroke="#000000"/>
<rect id="Like Button" x="16" y="860" width="84" height="38" fill="#FFFFFF" stroke="#000000"/>
<text x="33" y="884" font-family="Geist" font-size="13" font-weight="500" fill="#000">Like 8</text>
<rect id="Dislike Button" x="108" y="860" width="94" height="38" fill="#000000" stroke="#000000"/>
<text x="125" y="884" font-family="Geist" font-size="13" font-weight="500" fill="#FFFFFF">Dislike 6</text>
<rect id="Counter Reviews Button" x="210" y="860" width="164" height="38" fill="#FFFFFF" stroke="#000000"/>
<text x="229" y="884" font-family="Geist" font-size="13" font-weight="500" fill="#000">2 Counter Reviews</text>
</g>
<g id="Bottom Nav">
<rect x="0" y="776" width="195" height="68" fill="#000000"/>
<path d="M89 806 L97.5 798 L106 806 L106 816 L89 816 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
