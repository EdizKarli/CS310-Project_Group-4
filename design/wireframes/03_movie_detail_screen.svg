<path d="M284 817 C284 810 301 810 301 817" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
<text x="271" y="832" font-family="Space Mono" font-size="10" font-weight="400" fill="#000">PROFILE</text>
<line x1="0" y1="776.5" x2="390" y2="776.5" stroke="#000000"/>
